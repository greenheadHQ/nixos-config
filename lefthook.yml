pre-commit:
  parallel: true
  commands:
    lefthook-guard-self-check:
      # 회귀 방지 layer: install-lefthook-hooks.sh가 hook에 주입한 두 가지가 살아있는지
      # commit-time에 fail-fast로 확인한다.
      #   (1) staged-config guard 블록 (pre-commit)
      #   (2) 설치된 hook 세 개의 존재와, 각 lefthook 호출부의 --no-auto-install 플래그
      # 둘이 사라지는 경로는 두 가지다. 첫째, `lefthook run`은 lefthook.checksum이 stale하면
      # hook 전체를 암묵 재설치해(sync hooks) guard를 지운다 — (2)가 이 경로를 원천 차단하므로
      # (2)의 부재는 곧 다음 commit의 guard 소실을 뜻해 여기서 함께 막는다. 둘째, 인접
      # worktree의 raw `lefthook install`이 worktree-local 격리 없이 공유 hook을 덮어쓴다.
      # auto-install을 끈 이상 hook 파일이 없어도 lefthook이 되살려 주지 않는다. 없는 hook을
      # 건너뛰면 그 hook의 게이트가 조용히 사라지므로, 누락 자체를 fail-fast로 잡는다.
      # parallel: true이지만 어느 command든 fail이면 commit이 차단되므로 순서는 무관.
      run: |
        hooks_dir="$(git rev-parse --path-format=absolute --git-path hooks)"
        pre_commit="$hooks_dir/pre-commit"
        problem=""
        if [ ! -f "$pre_commit" ] || ! grep -Fq "# BEGIN nixos-config lefthook staged-config guard" "$pre_commit"; then
          problem="staged-config guard block missing from $pre_commit"
        else
          for hook_name in pre-commit commit-msg pre-push; do
            hook_path="$hooks_dir/$hook_name"
            if [ ! -f "$hook_path" ]; then
              problem="hook file missing: $hook_path (auto-install is disabled, so lefthook will not recreate it)"
              break
            fi
            # `"$@"`는 이 sh 블록에서 인자가 없어 빈 문자열로 확장된다. 기대 라인 전체를
            # 작은따옴표로 조립해 리터럴 `"$@"`를 보존한다.
            expected_call='call_lefthook run "'"$hook_name"'" --no-auto-install "$@"'
            if ! grep -Fxq -- "$expected_call" "$hook_path"; then
              problem="expected exact lefthook call [$expected_call] in $hook_path (lefthook's next auto-sync would silently drop the staged-config guard)"
              break
            fi
          done
        fi
        if [ -n "$problem" ]; then
          echo "lefthook-guard-self-check: $problem" >&2
          echo "  Cause: lefthook's implicit auto-sync regenerated the hooks (happens on the first run after lefthook.yml changes)," >&2
          echo "         or another worktree's raw 'lefthook install' overwrote the shared hook." >&2
          echo "  Fix:   bash scripts/ai/install-lefthook-hooks.sh   (or 'direnv reload') in the current worktree, then retry." >&2
          exit 1
        fi
    ai-skills-consistency:
      run: bash ./scripts/ai/run-staged-snapshot.sh -- bash ./scripts/ai/warn-skill-consistency.sh
    ai-skill-stale-identifiers:
      run: bash ./scripts/ai/run-staged-snapshot.sh -- bash ./scripts/ai/warn-skill-stale-identifiers.sh
    gitleaks:
      run: bash ./scripts/ai/run-gitleaks-staged-policy.sh
    nixfmt:
      glob: "*.nix"
      run: nixfmt --check {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck -S warning {staged_files}
    eval-tests:
      # glob: *.nix/flake.lock 은 평가 입력, tests/run-eval-tests.sh 는 runner 래퍼(로직 변경이 검증 동작을 바꿈).
      # glob 변경 시 scripts/ai/check-lefthook-staged-config.sh 의 expected 블록도 함께 갱신한다 (미동기화 시 staged-config guard fail).
      glob:
        - "*.nix"
        - "flake.lock"
        - "tests/run-eval-tests.sh"
      run: bash ./scripts/ai/run-staged-snapshot.sh -- bash ./tests/run-eval-tests.sh
    codex-hook-fixtures:
      # deterministic 모드 (live fixture 미실행). runner 자체가 scripts/ai/lib/tomlkit-bootstrap.sh를
      # source하여 repo-pinned pythonWithTomlkit으로 self-wrap하므로 lefthook에서 추가 nix shell
      # wrap이 불필요하다. live propagation 검증은 manual/scheduled에 위임.
      # glob: runner 가 source/cp 하는 의존 경로 집합과 동기화 필수. 새 의존 경로가 생기면 여기와
      # scripts/ai/check-lefthook-staged-config.sh 의 expected 블록을 함께 갱신한다 (누락 시 해당
      # 커밋에서 이 검사가 silent skip 된다; pre-push 가 glob 없이 전체 재검증하므로 push 에서 안전망).
      # runner 래퍼(tests/test-codex-hook-fixtures.sh) 자신도 멤버 — runner 로직 변경이 검증 동작을 바꾼다.
      glob:
        - "modules/shared/programs/codex/**"
        - "modules/shared/programs/claude/files/hooks/**"
        - "modules/shared/programs/claude/files/lib/**"
        - "tests/fixtures/codex-hooks/**"
        - "tests/test-codex-hook-fixtures.sh"
        - "tests/lib/**"
        - "scripts/ai/commit-msg-pinning.sh"
        - "scripts/ai/lib/tomlkit-bootstrap.sh"
        - "modules/shared/scripts/codex-exec-supervised.sh"
      run: bash ./scripts/ai/run-staged-snapshot.sh -- bash ./tests/test-codex-hook-fixtures.sh --no-live
    skill-noise-check:
      # shared skill projection (modules/shared/programs/claude/files/skills) 의 LLM 노이즈 syntax
      # (bold / excessive empty lines) 잔존 0 검증. pre-commit 은 staged snapshot 안에서
      # check-skill-noise.sh 의 기본 worktree 검사 경로를 사용한다.
      # script 는 Python stdlib only 라 nix shell wrap 불필요.
      run: bash ./scripts/ai/run-staged-snapshot.sh -- bash ./scripts/ai/check-skill-noise.sh
    local-skill-noise-check:
      # repo-local project skill corpus (.claude/skills) 의 동일 invariant 검증.
      # .agents/skills 는 .claude/skills 를 가리키는 directory symlink projection 이므로
      # hook 에서는 원본 corpus 의 staged snapshot 을 직접 검사한다.
      run: bash ./scripts/ai/run-staged-snapshot.sh -- bash ./scripts/ai/check-skill-noise.sh .claude/skills

commit-msg:
  commands:
    lefthook-guard-self-check:
      # pre-commit의 guard-self-check 복제. lefthook 2.x는 staged files이 0인 commit
      # (예: `git commit --allow-empty`)에서 pre-commit command를 "(skip) no matching
      # staged files"로 무력화한다. commit-msg hook은 staged files와 무관하게 항상
      # 실행되므로, 이 layer가 staged-files-가-0인 경로의 우회 시나리오까지 차단한다.
      run: |
        hooks_dir="$(git rev-parse --path-format=absolute --git-path hooks)"
        pre_commit="$hooks_dir/pre-commit"
        problem=""
        if [ ! -f "$pre_commit" ] || ! grep -Fq "# BEGIN nixos-config lefthook staged-config guard" "$pre_commit"; then
          problem="staged-config guard block missing from $pre_commit"
        else
          for hook_name in pre-commit commit-msg pre-push; do
            hook_path="$hooks_dir/$hook_name"
            if [ ! -f "$hook_path" ]; then
              problem="hook file missing: $hook_path (auto-install is disabled, so lefthook will not recreate it)"
              break
            fi
            # `"$@"`는 이 sh 블록에서 인자가 없어 빈 문자열로 확장된다. 기대 라인 전체를
            # 작은따옴표로 조립해 리터럴 `"$@"`를 보존한다.
            expected_call='call_lefthook run "'"$hook_name"'" --no-auto-install "$@"'
            if ! grep -Fxq -- "$expected_call" "$hook_path"; then
              problem="expected exact lefthook call [$expected_call] in $hook_path (lefthook's next auto-sync would silently drop the staged-config guard)"
              break
            fi
          done
        fi
        if [ -n "$problem" ]; then
          echo "lefthook-guard-self-check (commit-msg): $problem" >&2
          echo "  Cause: lefthook's implicit auto-sync regenerated the hooks (happens on the first run after lefthook.yml changes)," >&2
          echo "         or another worktree's raw 'lefthook install' overwrote the shared hook." >&2
          echo "  Fix:   bash scripts/ai/install-lefthook-hooks.sh   (or 'direnv reload') in the current worktree, then retry." >&2
          exit 1
        fi
    pinning:
      # 워크트리/cherry-pick 시나리오에서 lefthook.yml만 받고 스크립트 미동반 시
      # 차단 회피용 방어 가드 (silent skip).
      run: '[ -f ./scripts/ai/commit-msg-pinning.sh ] && bash ./scripts/ai/commit-msg-pinning.sh {1} || true'

pre-push:
  # 5개 command(shell-script-tests·codex-hook-fixtures·analyzing-da-sessions-tests·flake-check·statusline-bats)를 병렬 실행한다.
  # 각 command는 독립적이고 read-only 검증이라 순서 의존이 없다. 러너 자체 병렬화(job-pool)와
  # over-subscribe되지만 대부분 I/O 바운드(git/파일/nix eval)라 경합이 흡수되어, 순차 합보다 크게
  # 빠르다(실측: 순차 합 ~82s → 병렬 wall-clock ~42s). 러너 병렬화 + GNU 보장(#1009) 전까지는
  # pre-push가 ~175s 걸리고 karakeep fixture 실패로 push가 차단됐다 — 이 변경으로 둘 다 해소된다.
  parallel: true
  commands:
    shell-script-tests:
      # nix shell wrap: codex-config fixture의 tomlkit + karakeep/backup fixture의 GNU 전용 확장
      # (`touch -d '40 days ago'`, `find -printf`)을 위해 repo-pinned pythonWithTomlkit + GNU
      # coreutils/findutils를 PATH에 얹어 실행한다(#1009: devShell 밖 BSD 도구로 karakeep fixture
      # 실패). devShell은 건드리지 않아 direnv/bare python3 해석 영향이 없다. `--inputs-from .`로
      # nixpkgs#를 repo flake.lock에 pin해 임시 registry fetch를 피한다(statusline-bats와 동일 패턴).
      # claude-rc(#1052)가 require_cmd lsof를 도입했고 lsof는 NixOS 시스템 프로파일/CI PATH에
      # 항상 있지 않으므로 nixpkgs#lsof도 명시 제공한다(#1009와 동일 패턴). lefthook auto-sync
      # end-to-end 테스트는 stub이 아닌 실제 lefthook을 요구하는데, hook이 lefthook을 nix store
      # 절대경로로 호출하면 자식 PATH에 lefthook이 없다. 같은 이유로 nixpkgs#lefthook도 얹는다.
      # `_TOMLKIT_BOOTSTRAP_READY=1`로 run-shell-script-tests.sh 내부 tomlkit-bootstrap.sh의 중첩
      # `nix shell` re-exec을 막는다(이 wrap이 이미 동일 hermetic 런타임을 제공). 테스트 병렬 실행은
      # 러너 자체(tests/lib/parallel-harness.sh job-pool)가 담당하므로 여기서 추가 배선은 없다.
      run: nix shell --inputs-from . .#pythonWithTomlkit nixpkgs#coreutils nixpkgs#findutils nixpkgs#lsof nixpkgs#lefthook --command env _TOMLKIT_BOOTSTRAP_READY=1 bash ./tests/run-shell-script-tests.sh
    codex-hook-fixtures:
      # pre-commit에 이미 동일 명령이 있지만 push 직전 재검증해 stale state 회귀 차단.
      # runner self-bootstrap이라 추가 nix shell wrap 불필요. live propagation은 attach하지 않음.
      run: bash ./tests/test-codex-hook-fixtures.sh --no-live
    analyzing-da-sessions-tests:
      # run-da VERDICT_JSON/dir marker 형식과 analyze.py 추출 계약을 hermetic pytest fixture로 검증한다.
      # driver가 `nix run --inputs-from . nixpkgs#python3Packages.pytest`를 호출하므로
      # pytest 런타임은 repo flake.lock에 pin되고 pythonWithTomlkit 스코프를 확장하지 않는다.
      run: bash ./tests/run-analyzing-da-sessions-tests.sh
    flake-check:
      run: nix flake check --no-build --all-systems
    statusline-bats:
      # statusline.sh 폭 측정 fallback chain 회귀 검증. git hook PATH 는 devShell
      # buildInputs 를 보장하지 않으므로 `nix shell` wrap 으로 hook 실행 환경
      # PATH 와 무관하게 동작하게 한다. `--inputs-from .` 는 repo flake.lock 의
      # nixpkgs 입력을 재사용하여 `nix shell .#pythonWithTomlkit` 패턴과 동일하게
      # 프로젝트 pin 을 우회하지 않게 한다. pre-commit allowlist guard 우회를
      # 위해 pre-push 에 배치. bats 호출은 ~1초로 짧아 비용 미미. Codex 같은
      # 비대화형 셸은 TERM 을 안 줄 수 있으므로 Bats/tput 용 기본 TERM 을 주입한다.
      run: env TERM="${TERM:-xterm-256color}" nix shell --inputs-from . nixpkgs#bats --command bats modules/shared/programs/claude/files/scripts/tests/statusline.bats
