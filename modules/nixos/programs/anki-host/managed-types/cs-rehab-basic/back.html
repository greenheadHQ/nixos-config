<script>
(() => {
  if (window.AnkiNoteLinkerIsActive) return;
  const root = document.documentElement;
  if (!root.classList.contains("iphone") && !root.classList.contains("ipad")) return;

  if (window.AnkiNoteLinkerMobileVersion !== 3) {
    const pattern = /\[((?:[^\[]|\\\[)*?)\|nid(\d{13})\]/g;
    const inline = new Set("B STRONG I EM U S STRIKE DEL INS SPAN FONT SMALL BIG SUB SUP MARK".split(" "));
    const excluded = "a,button,select,textarea,script,style,pre,code,svg,math,mjx-container,.MathJax,.MathJax_Preview,.katex,[contenteditable]";
    const escaped = (value, index) => {
      let slashes = 0;
      while (index > 0 && value[--index] === "\\") slashes++;
      return slashes % 2 !== 0;
    };
    const renderRun = nodes => {
      const text = nodes.map(node => node.nodeValue).join("");
      // MathJax may not have replaced Anki's native TeX delimiters yet.
      const math = Array.from(text.matchAll(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]/g));
      const positions = [];
      let offset = 0;
      nodes.forEach(node => {
        positions.push({ node, start: offset, end: offset + node.length });
        offset += node.length;
      });
      const point = (index, end = false) => positions.find(position =>
        end ? position.start < index && index <= position.end
          : position.start <= index && index < position.end);
      const matches = Array.from(text.matchAll(pattern));
      // Work backwards so earlier node offsets remain valid after replacement.
      matches.reverse().forEach(match => {
        if (escaped(text, match.index)) return;
        if (math.some(item => item.index < match.index + match[0].length
            && item.index + item[0].length > match.index)) return;
        const start = point(match.index);
        const titleEnd = match.index + 1 + match[1].length;
        const suffix = point(titleEnd);
        const end = point(match.index + match[0].length, true);
        // Only a complete inline title is moved. A marker spanning partially
        // opened tags or formatting inside its nid suffix stays literal.
        if (!start || !suffix || !end || suffix.node !== end.node
            || start.node.parentNode !== end.node.parentNode) return;
        const whole = document.createRange();
        whole.setStart(start.node, match.index - start.start);
        whole.setEnd(end.node, match.index + match[0].length - end.start);
        const title = document.createRange();
        title.setStart(start.node, match.index + 1 - start.start);
        title.setEnd(suffix.node, titleEnd - suffix.start);
        const content = title.extractContents();
        const walker = document.createTreeWalker(content, 4);
        while (walker.nextNode()) {
          const node = walker.currentNode;
          node.nodeValue = node.nodeValue.replace(/\\\[/g, "[");
        }
        const link = document.createElement("a");
        link.className = "noteLink";
        link.href = "anki://x-callback-url/search?query=nid%3A" + match[2];
        link.appendChild(content);
        whole.deleteContents();
        whole.insertNode(link);
      });
    };
    const renderContainer = container => {
      if (container.closest(excluded)) return;
      let run = [];
      const flush = () => {
        if (run.length) renderRun(run);
        run = [];
      };
      const walk = parent => {
        // Snapshot children: rendering a previous run can insert new nodes.
        Array.from(parent.childNodes).forEach(node => {
          if (node.nodeType === 3) run.push(node);
          else if (node.nodeType === 1 && !node.matches(excluded)) {
            if (inline.has(node.tagName)) walk(node);
            else {
              flush();
              walk(node);
              flush();
            }
          } else flush();
        });
      };
      walk(container);
      flush();
    };
    window.AnkiNoteLinkerMobileVersion = 3;
    window.AnkiNoteLinkerRenderMobile = () => {
      document.querySelectorAll(".linkRender").forEach(renderContainer);
    };
  }

  if (document.readyState === "loading") {
    if (!window.AnkiNoteLinkerMobileRenderPending) {
      window.AnkiNoteLinkerMobileRenderPending = true;
      document.addEventListener("DOMContentLoaded", () => {
        window.AnkiNoteLinkerMobileRenderPending = false;
        window.AnkiNoteLinkerRenderMobile();
      }, { once: true });
    }
  } else {
    window.AnkiNoteLinkerRenderMobile();
  }
})();
</script>

  const CONTROLS = "AnkiCodeControlsV1";

    };
    const update = () => {
      root.style.setProperty("--anki-code-scale", String(scale / 100));
      toolbar.querySelector("output").textContent = `${scale}%`;
      toolbar.querySelector('[data-action="smaller"]').disabled = scale === 80;
      toolbar.querySelector('[data-action="larger"]').disabled = scale === 140;
      toolbar.querySelector('[data-action="reset"]').disabled = scale === 100;
    };
    const mount = () => {
      const nextRoot = document.getElementById("qa") || document.body;
      const blocks = Array.from(nextRoot.querySelectorAll(".anki-code-scope pre > code"));
      const nextFirst = blocks.find(code => !code.closest("details:not([open]), [hidden]"))?.parentElement;
      const id = nextRoot.querySelector("[data-anki-cid]")?.dataset.ankiCid;
      const nextId = /^[1-9][0-9]*$/.test(id || "") ? id : null;
      const nextAnswer = !!nextRoot.querySelector("#answer");
      // Keep only the current card, including a replaced FrontSide DOM. Never
      // persist preferences or infer identity from note text. A preview without
      // CardID may retain a setting only while its exact code node survives.
      if (nextId ? nextId !== cardId || (answer && !nextAnswer)
        : nextRoot !== root || nextFirst !== first || cardId !== null) scale = 100;
      cardId = nextId;
      answer = nextAnswer;
      if (root !== nextRoot) {
        root?.removeEventListener("toggle", onToggle, true);
        root?.style.removeProperty("--anki-code-scale");
        // Native details toggles do not bubble. Keep the one toolbar reachable
        // when optional code is expanded, without observing or rewriting code.
        nextRoot.addEventListener("toggle", onToggle, true);
      }
      root = nextRoot;
      first = nextFirst;
      // FrontSide may carry previously rendered markup, but not its listeners.
      for (const duplicate of root.querySelectorAll(".anki-code-controls")) {
        if (duplicate !== toolbar) duplicate.remove();
      }
      if (!first) {
        toolbar?.remove();
        toolbar = null;
        if (blocks.length) root.style.setProperty("--anki-code-scale", String(scale / 100));
        else root.style.removeProperty("--anki-code-scale");
        return;

        bar.className = "anki-code-controls";

        bar.setAttribute("aria-label", "이 카드의 코드 글자 크기");

        // focus and scrolling. No document-wide or code-block gesture handlers.
        for (const name of ["pointerdown", "pointerup", "mousedown", "mouseup",
          "touchstart", "touchend", "keydown", "keypress", "keyup"]) {

            scale + (action === "larger" ? 10 : -10)));

      python: "python", py: "python", java: "java", yaml: "yaml", yml: "yaml", http: "http"

      const value = window.AnkiSyntaxHighlightLibraryV1;

      const started = performance.now();

      const painting = performance.now();

      for (const code of nodes) {
        if (!code.isConnected) continue;

          continue;

        if (previous) { code.textContent = text; code.classList.remove("hljs"); }

          metrics.skipped++;
