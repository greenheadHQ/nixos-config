  let renderAttached = false;
  try {
    window[COPY].mount();
    window[CONTROLS].mount();
    // Opacity preserves layout but does not remove controls from keyboard focus.
    // Disable only our copy buttons until their field's first display is ready,
    // including when an older shared copy module survives in the reused WebView.
    for (const field of fenceFields) {
      if (!field.hasAttribute("data-anki-fence-pending")) continue;
      for (const button of field.querySelectorAll(".anki-code-copy button")) {
        button.disabled = true;
        button.setAttribute("data-anki-fence-copy-pending", "");
      }
    }
    // Anki reuses its WebView, including globals, across question/answer/card changes.
    // Each script invocation gets a new generation; a pending old card cannot paint it.
    window[KEY].render().then(metrics => {
      if (!metrics.stale) reveal(fenceFields);
    }, () => reveal(fenceFields));
    renderAttached = true;
  } finally {
    // Setup failures must not leave the question/answer hidden. Once completion
    // handlers are attached, keep the asynchronous readiness/stale policy above.
    if (!renderAttached) reveal(fenceFields);
  }
})();
</script>
