# tmux.conf

# ============================================================================
# 1. 기본 설정
# ============================================================================

# Extended keys (CSI u / Kitty Keyboard Protocol) 활성화
# Claude Code 등 CSI u를 사용하는 애플리케이션과의 호환성 개선
set -g extended-keys on
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# True color 및 터미널 오버라이드
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"

# yazi SSH 이미지 프리뷰 전제: Kitty graphics 프로토콜이 tmux를 우회하도록 허용하고,
# SSH 재접속 시 TERM/TERM_PROGRAM이 session environment로 갱신되게 한다.
# 출처: https://yazi-rs.github.io/docs/image-preview/
# 주의: `set -ga`는 array option에 append이므로 실행 중인 서버에서 설정을 다시
#       source하면 update-environment에 동일 항목이 여러 번 쌓인다. 동작상 무해
#       (tmux attach 시 동일 key가 중복되어도 마지막 값 전달).
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment COLORTERM

# 외부 launcher(예: Codex Desktop, AI 에이전트 GUI 등)가 자식 프로세스에 NO_COLOR=1
# 또는 COLORTERM='' 을 export한 상태로 tmux server를 첫 spawn하면, tmux는 그 환경을
# server-global env에 캐시하여 이후 모든 페인이 상속한다(=Claude Code 등 NO_COLOR 표준
# 준수 앱이 색을 끔). conf source 시점에 강제 정리해 회귀를 차단한다.
# nixos-config 자체는 NO_COLOR를 관리하지 않으므로 정적 unset이 안전하다.
set-environment -g -u NO_COLOR
set-environment -g COLORTERM truecolor

# 창/pane 이름 자동 변경 비활성화
set -g automatic-rename off
set -g allow-rename off

# 메시지 표시 시간
set -g display-time 2000

# 에디터 설정
set-environment -g EDITOR "nvim"

# pane-base-index (base-index는 Nix에서 설정, pane-base-index는 HM 옵션 없음)
setw -g pane-base-index 1

# 윈도우 번호 자동 재정렬
set -g renumber-windows on

# OSC 52 클립보드
set -g set-clipboard on

# ============================================================================
# 2. 마우스 및 스크롤 설정
# ============================================================================

# 마우스 휠 스크롤 자동화
# - 마우스 이벤트 사용 앱(vim, less 등) 실행 시: 해당 앱에 전달
# - copy-mode일 때: 스크롤
# - 그 외: copy-mode 진입 후 스크롤
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -X scroll-up' 'copy-mode -e; send-keys -X scroll-up'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# ============================================================================
# 3. Pane 설정
# ============================================================================

# 경계선 스타일
set -g pane-border-style fg=cyan,bg=default
set -g pane-active-border-style fg=red,bg=default,bold
set -g pane-border-lines heavy

# Pane 배경색 (활성/비활성 구분)
set -g window-active-style 'fg=terminal,bg=terminal'
set -g window-style 'fg=colour245,bg=default'

# Pane 테두리 상단에 Git 브랜치 표시
# 표시 예시:
#   [ main]                   (Git 저장소)
#   [🚨 Git 프로젝트가 아님!]  (Git 아님)
set -g pane-border-status top
set -g pane-border-format ' #{?pane_active,#[fg=yellow]#[bold],#[fg=cyan]#[bold]}#[fg=yellow]#[bold][#(cd "#{pane_current_path}" && branch=$(git symbolic-ref --short HEAD 2>/dev/null) && echo " $branch" || echo "🚨 Git 프로젝트가 아님!")]#[default]'

# ============================================================================
# 4. 상태 표시줄 설정
# ============================================================================

set -g status-position top
set -g status-style bg=black,fg=white
set -g status-justify left
set -g status-interval 5

# 왼쪽: 세션 이름
set -g status-left-length 20
set -g status-left '#[fg=cyan,bold]S: #S'

# 오른쪽: 현재 경로 + Git 브랜치
set -g status-right-length 150
set -g status-right '#[fg=cyan,bold]#(sh -c "printf %s \"#{pane_current_path}\" | sed \"s|^$HOME|~|\") #[fg=yellow,bold](#(cd "#{pane_current_path}" && git symbolic-ref --short HEAD 2>/dev/null || echo "")) #[default]'

# 창 목록 스타일
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=black,bg=yellow,bold] #I:#W '
