personality = "pragmatic"
model = "gpt-5.5"
model_auto_compact_token_limit = 900000
model_context_window = 1000000
model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true

[notice]
hide_full_access_warning = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"

[features]
multi_agent = true
apps = true
prevent_idle_sleep = true
voice_transcription = true
goals = true
default_mode_request_user_input = true

# Codex 0.124+ stable hooks (issue #585 / epic #584).
# hooks는 PR openai/codex#19012로 default-enabled가 되어 `[features].hooks`로 노출되며
# 명시 활성화 불필요. 강제 활성화가 필요하면 `[features].hooks = true`.
# 구 `codex_hooks` flag는 codex 0.130 기준 deprecated alias다 — 입력 시 codex가
# "[features].codex_hooks is deprecated. Use [features].hooks instead." 경고를 띄우므로 사용 금지.
# Stop은 _stop-dispatcher.sh 단일 entry로 등록 (Codex가 같은 이벤트의 multiple command를
# concurrent 실행하므로 ordering 보장을 dispatcher에 위임).
# subagent agent_id 부재 등은 graceful fallback에 의존.
#
# 사용자 hook 추가 워크플로 주의 (sync-codex-config.py 정책):
# template이 선언한 `[[hooks.UserPromptSubmit]]`, `[[hooks.Stop]]`, `[[hooks.PreToolUse]]`,
# `[[hooks.PostToolUse]]`
# array에 사용자가 별도 entry를 추가하면, nrs 재실행 시 array 전체가 template-owned로
# 덮어써져 사용자 entry가 손실된다. 보존되는 사용자 hook 등록은 다음 한 가지뿐이다:
#   - template이 선언하지 않은 다른 이벤트(`SessionStart` 등)에 추가.
# Stop dispatcher 경유 sub-script 등록은 _stop-dispatcher.sh 자체가 tracked 파일이므로
# 본 repo의 dispatcher 수정이 필요하며 user-config 작업으로는 지원되지 않는다.
# same-event append/identity merge는 sync-codex-config.py 변경 필요로 별도 follow-up.
# PreToolUse pinning-guard는 issue #587에서 template-owned로 등록되었다.
# PostToolUse pinning-alert는 issue #603에서 template-owned로 등록되었다.

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "$HOME/.codex/hooks/record-prompt-submit.sh"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "$HOME/.codex/hooks/_stop-dispatcher.sh"

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "$HOME/.codex/hooks/pinning-guard.sh"

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "$HOME/.codex/hooks/pinning-alert.sh"

[plugins."github@openai-curated"]
enabled = true

[plugins."figma@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."notion@openai-curated"]
enabled = true

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest", "--autoConnect", "--channel=stable", "--no-usage-statistics"]

[mcp_servers.chrome-devtools.env]
npm_config_registry = "https://registry.npmjs.org/"
# chrome-devtools-mcp --autoConnect의 heavy 작업(큰 스냅샷·무거운 페이지) 시 V8 old-space OOM 방어.
# 8192MB(=8GB)는 점유가 아닌 상한이며, host RAM(32GB)의 25% 내에서 무거운 힙 스냅샷까지 여유를 두고 선정한다
# (4096MB로도 단발 OOM 방어엔 충분하나 여유분으로 8192MB 채택). NODE_OPTIONS는 npx install 단계를 포함한
# npx 프로세스 트리 전체에 상속되지만, 상한일 뿐이라 동작상 부작용은 없다. upstream 메모리 누수
# (ChromeDevTools/chrome-devtools-mcp#1192)는 이미 수정됐으나, 단발성 OOM 안전벨트로 명시 유지한다.
# 동일 값이 Claude용 mcp.darwin.json env에도 중복 존재한다 — 한쪽 변경 시 반드시 양쪽을 함께 수정한다.
NODE_OPTIONS = "--max-old-space-size=8192"
