# 이 파일이 선언한 leaf는 template-owned다 — 매 activation마다 배포본(~/.codex/config.toml)에
# 덮어써진다. 선언하지 않은 키는 user-owned로 보존되므로, 여기서 키를 지우는 것만으로는 이미
# 배포된 값이 사라지지 않는다 (tests/test-codex-hook-fixtures.sh의 sync-preservation scenario-G가
# 이 동작을 고정한다).
# 배포본에서까지 영구 회수해야 하는 정책 키는 files/retired-config-keys.txt에 등록한다 — 그러면
# nrs가 (activation / NO_CHANGES 복구 양쪽에서) 제거하고 verify-ai-compat.sh가 잔존을 drift로
# 잡는다. 앱 UI가 persist하는 앱 소유 키(model·model_reasoning_effort·service_tier)는 그 목록에
# 넣지 않는다 — 영구 회수는 사용자의 UI 선택까지 매 nrs마다 지우기 때문이다.
# 2026-09-05에 템플릿에서 뗀 옛 pin 값(model·model_reasoning_effort)은 "1회만 지우고 그 뒤로는
# 보존"이라 이 메커니즘으로 표현할 수 없다 — 호스트마다 codex 세션 종료 후 그 줄을 1회 수동
# 삭제하고 `nrs --force` → `./scripts/ai/verify-ai-compat.sh`로 확인한다. 그 뒤 다시 나타나는
# 값은 앱 UI가 persist한 사용자 선택이므로 그대로 둔다.
personality = "pragmatic"
# model·model_reasoning_effort는 템플릿에 두지 않는다 — Codex Desktop/TUI가 UI에서 고른 값을
# ~/.codex/config.toml 최상위 키에 persist하므로, template-owned로 두면 nrs마다 되돌아가 UI 선택이
# 무효가 된다(2026-09-05 Desktop 슬라이더 실측). 세션 취향(모델·effort)은 앱 UI가 단일 소스이고,
# 이 템플릿은 정책·안전 경계(approval_policy, sandbox_mode, features, agents, hooks)만 선언한다.
# 미지정 시 codex는 카탈로그 priority 1(frontier)과 그 모델의 기본 effort를 쓴다. 어떤 모델이
# 어떤 effort를 지원하는지는 `codex debug models`의 supported_reasoning_levels로 확인한다.
approval_policy = "never"
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true

[notice]
hide_full_access_warning = true

# Linux default disables `apps` to skip `codex_apps` MCP boot; use `codex-apps`
# shell alias for opt-in connector / plugin / tool_search surface (#772).
# 아래 값은 "upstream 기본이 뒤집혀도 이 값을 강제한다"는 의도의 명시 핀이다 — 현행 기본과
# 같은 값이어도 유지한다. 재검증(현행 기본값): CODEX_HOME=$(mktemp -d) codex features list
[features]
# multi_agent: run-da fan-out의 전제 (using-codex-exec/references/known-issues.md의 spawn probe 절).
# 0.153.4 기준 upstream 기본도 true지만, 기본이 뒤집히면 fan-out이 조용히 4슬롯으로 퇴화하므로 명시 고정.
multi_agent = true
# apps: upstream 기본 true를 linux에서만 끈다 (위 #772 근거).
apps = false
prevent_idle_sleep = true
# goals: 0.153.4 기준 upstream 기본도 true — 기본 회귀 시에도 켜두려고 명시 고정.
goals = true
default_mode_request_user_input = true

# Multi-agent 동시 실행 상한 (codex 0.153.4·2026-09-05 실측 시점 기준).
# `[agents].max_concurrent_threads_per_session`은 primary thread를 제외하고 동시에 열어둘 수
# 있는 spawned-agent thread 수 상한이다. 16이면 세션 developer 메시지가 광고하는 total slot이
# 17(root 포함)이 되고, run-da는 그 광고 slot 안에서만 fan-out한다
# (`run-da/references/runtime-mapping.md`의 capability profile 계약). 미설정 시 기본은 total 4
# (= child 3)이라 `audit MAX`의 10개 관점이 4회 batch로 쪼개졌다. 16은 그 10개를 한 번에
# 발사하고 6 slot을 여유로 남긴다.
# 같은 이름을 top-level에 두면 codex가 미지의 top-level 키로 보고 조용히 무시하므로
# (top-level은 unknown 키를 거부하지 않는다 — `-c totally_bogus_key=1`도 config.load ok)
# 반드시 `[agents]` 테이블 아래에 둔다.
# `agents.max_threads`는 같은 필드의 legacy alias다. 병기하면 codex가 startup warning
# "Ignoring malformed agent role definition: duplicate field ..."를 내므로 병기 금지.
# `[features].multi_agent_v2`를 켜도 이 값은 그대로 반영된다 (0.146.0·2026-08-02 시점 실측: v2 ON + 이 키
# 16 → 17 slot). 단 features.multi_agent_v2.max_concurrent_threads_per_session은 root를 포함한
# total 기준이라 같은 16이 17이 아닌 16 slot이 되므로, 기준이 다른 두 키를 병기하지 않는다.
# 재검증: codex debug prompt-input 'probe' \
#           | jq -r '[.[]|select(.role=="developer")|([.content[]?.text//empty]|join("\n"))]|join("\n")' \
#           | grep -Eo 'There are [0-9]+ available concurrency slots'
#         → "There are 17 available concurrency slots"면 반영된 것이다.
[agents]
max_concurrent_threads_per_session = 16

# Codex 0.124+ stable hooks (issue #585 / epic #584).
# hooks는 PR openai/codex#19012로 default-enabled가 되어 `[features].hooks`로 노출되며
# 명시 활성화 불필요. 강제 활성화가 필요하면 `[features].hooks = true`.
# 구 `codex_hooks` flag는 codex 0.130 기준 deprecated alias다 — 입력 시 codex가
# "[features].codex_hooks is deprecated. Use [features].hooks instead." 경고를 띄우므로 사용 금지.
# Stop은 _stop-dispatcher.sh 단일 entry로 등록 (Codex가 같은 이벤트의 multiple command를
# concurrent 실행하므로 ordering 보장을 dispatcher에 위임).
# subagent agent_id 부재 등은 graceful fallback에 의존.
#
# 사용자 hook 추가 워크플로 주의 (sync-codex-config.py 정책):
# template이 선언한 `[[hooks.UserPromptSubmit]]`, `[[hooks.Stop]]`, `[[hooks.PreToolUse]]`,
# `[[hooks.PostToolUse]]`
# array에 사용자가 별도 entry를 추가하면, nrs 재실행 시 array 전체가 template-owned로
# 덮어써져 사용자 entry가 손실된다. 보존되는 사용자 hook 등록은 다음 한 가지뿐이다:
#   - template이 선언하지 않은 다른 이벤트(`SessionStart` 등)에 추가.
# Stop dispatcher 경유 sub-script 등록은 _stop-dispatcher.sh 자체가 tracked 파일이므로
# 본 repo의 dispatcher 수정이 필요하며 user-config 작업으로는 지원되지 않는다.
# same-event append/identity merge는 sync-codex-config.py 변경 필요로 별도 follow-up.
# PreToolUse pinning-guard는 issue #587에서 template-owned로 등록되었다.
# PostToolUse pinning-alert는 issue #603에서 template-owned로 등록되었다.

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "t=\"$HOME/.codex/hooks/record-prompt-submit.sh\"; if [ -x \"$t\" ]; then exec \"$t\"; fi; printf '%s\\n' '[codex-hook] target missing or not executable: ~/.codex/hooks/record-prompt-submit.sh. Impact: hook skipped to avoid raw 127.' 'Action: run nrs --force, then ./scripts/ai/verify-ai-compat.sh.' >&2; exit 0"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "t=\"$HOME/.codex/hooks/_stop-dispatcher.sh\"; if [ -x \"$t\" ]; then exec \"$t\"; fi; printf '%s\\n' '[codex-hook] target missing or not executable: ~/.codex/hooks/_stop-dispatcher.sh. Impact: hook skipped to avoid raw 127.' 'Action: run nrs --force, then ./scripts/ai/verify-ai-compat.sh.' >&2; exit 0"

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "t=\"$HOME/.codex/hooks/pinning-guard.sh\"; if [ -x \"$t\" ]; then exec \"$t\"; fi; printf '%s\\n' '{\"hookSpecificOutput\":{\"hookEventName\":\"PreToolUse\",\"permissionDecision\":\"deny\",\"permissionDecisionReason\":\"Codex managed hook target is missing or not executable: ~/.codex/hooks/pinning-guard.sh. Impact: edit is denied until the hook is restored. Action: run nrs --force, then ./scripts/ai/verify-ai-compat.sh.\"}}'; exit 0"

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = "t=\"$HOME/.codex/hooks/pinning-alert.sh\"; if [ -x \"$t\" ]; then exec \"$t\"; fi; printf '%s\\n' '[codex-hook] target missing or not executable: ~/.codex/hooks/pinning-alert.sh. Impact: hook skipped to avoid raw 127.' 'Action: run nrs --force, then ./scripts/ai/verify-ai-compat.sh.' >&2; exit 0"
